<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Virio</title>
  <link rel="stylesheet" href="virio.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <div class="id">
      <svg class="mark" viewBox="4 2 192 234" aria-hidden="true"><path d="M100 10 L182 40 C186 41.5 188 45 188 49 V112 C188 166 152 204 100 228 C48 204 12 166 12 112 V49 C12 45 14 41.5 18 40 Z" fill="#2bc97a" fill-opacity="0.14" stroke="#2bc97a" stroke-width="16" stroke-linejoin="round"/><rect x="82" y="66" width="36" height="104" rx="18" fill="#2bc97a"/></svg>
      <strong>Virio</strong>
    </div>
    <button class="switch" id="toggle" type="button" role="switch" aria-checked="true">
      <span class="lbl" id="toggle-label">Protection active</span>
      <span class="track" aria-hidden="true"><i></i></span>
    </button>
  </header>

  <main>
    <p class="site mono" id="site"></p>
    <section class="status" id="status">
      <p class="pill neutral" id="pill">Analyse…</p>
      <h1 id="title">Virio regarde ce site</h1>
      <p class="summary" id="summary"></p>
    </section>

    <div class="risk" id="risk" hidden>
      <div class="risk-head"><span>Niveau de risque</span><strong id="risk-value"></strong></div>
      <div class="meter"><i id="risk-bar"></i></div>
    </div>

    <ul class="reasons" id="reasons"></ul>

    <section class="block" id="checks-block" hidden>
      <h2>Contrôles effectués</h2>
      <ul class="checks" id="checks"></ul>
    </section>

    <div class="acts" id="acts"></div>
  </main>

  <footer class="foot">
    <span id="lists">Listes de sites signalés : chargement…</span>
    <button class="link" id="refresh" type="button">Mettre à jour</button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
